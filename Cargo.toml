[package]
name = "partikl"
version = "0.1.0"
edition = "2024"

[features]
# Przeładowanie shaderów GPU (wkompilowanych w binarkę) po zapisie pliku źródłowego.
# Działa, gdy program startuje z katalogu repozytorium: `cargo dev`.
dev = [ "bevy/embedded_watcher" ]

[dependencies]
ron = "0.12.3"
clap = { version = "4.6.8", features = [ "derive" ] }
bevy = "0.20"
bytemuck = { version = "1", features = [ "derive" ] }
# Typy wgpu, których Bevy nie re-eksportuje (znaczniki czasu GPU); ta sama wersja co w Bevy.
wgpu = { version = "30.0.2", default-features = false }

[dependencies.chrono]
version = "0.4.45"
features = [ "serde" ]

[dependencies.rand]
version = "0.10.4"

[dependencies.serde]
version = "1.0.229"
features = [ "serde_derive" ]

[dev-dependencies]
serde_json = "1"
arrow-array = "60.1"
arrow-schema = "60.1"

[dev-dependencies.parquet]
version = "60.1"
default-features = false
features = [ "arrow", "zstd" ]

[profile.bench]
inherits = "release"
debug = "line-tables-only"

[[bench]]
name = "gpu"
path = "benches/gpu/main.rs"
harness = false
