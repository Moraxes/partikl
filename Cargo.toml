[package]
name = "partikl"
version = "0.1.0"
edition = "2021"

[dependencies]
ron = "0.12.3"
clap = { version = "4.6.8", features = [ "derive" ] }
bevy = "0.15"

[dependencies.chrono]
version = "0.4.45"
features = [ "serde" ]

[dependencies.rand]
version = "0.8.4"
features = [ "small_rng" ]

[dependencies.serde]
version = "1.0.229"
features = [ "serde_derive" ]
