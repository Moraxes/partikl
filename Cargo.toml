[package]
name = "partikl"
version = "0.1.0"
edition = "2024"

[dependencies]
ron = "0.12.3"
clap = { version = "4.6.8", features = [ "derive" ] }
bevy = { version = "0.20", features = [ "file_watcher" ] }
bytemuck = { version = "1", features = [ "derive" ] }
wide = "1.7.1"

[dependencies.chrono]
version = "0.4.45"
features = [ "serde" ]

[dependencies.rand]
version = "0.10.4"

[dependencies.serde]
version = "1.0.229"
features = [ "serde_derive" ]

[dev-dependencies]
serde_json = "1"
arrow-array = "60.1"
arrow-schema = "60.1"

[dev-dependencies.parquet]
version = "60.1"
default-features = false
features = [ "arrow", "zstd" ]

[[bench]]
name = "sim"
path = "benches/sim/main.rs"
harness = false

[[bench]]
name = "grid"
path = "benches/grid/main.rs"
harness = false

[[bench]]
name = "probe"
path = "benches/probe/main.rs"
harness = false

[profile.bench]
inherits = "release"
debug = "line-tables-only"
